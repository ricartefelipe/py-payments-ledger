name: ci

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # Os testes de integridade financeira provam invariantes que vivem no banco
    # — trigger append-only, unicidade sob concorrencia, `SELECT ... FOR UPDATE`.
    # Sem um PostgreSQL real eles seriam marcados como skip, e a CI aprovaria o
    # que nao exercitou.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
      TEST_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      JWT_ISSUER: test-issuer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Record toolchain versions
        run: |
          python --version
          ruff --version
          black --version
          mypy --version
          pip --version

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Format check (black)
        run: |
          black --check .

      - name: Type check (mypy)
        run: |
          mypy src

      - name: Apply migrations
        env:
          # Segredo efemero, gerado por execucao: a migration so precisa que a
          # configuracao valide. Nenhum valor literal fica no repositorio.
          JWT_SECRET: ${{ github.run_id }}-${{ github.run_attempt }}-ci-migration-only
        run: |
          alembic upgrade head

      - name: Tests with coverage
        # JWT_SECRET nao e definido aqui de proposito: `tests/conftest.py` usa
        # `os.environ.setdefault`, e um valor externo substituiria o segredo com
        # que os testes assinam os tokens, quebrando a validacao.
        env:
          # Com isto, banco indisponivel vira **falha**, nao skip: a CI nao pode
          # aprovar sem exercitar as invariantes que vivem no banco.
          REQUIRE_INTEGRATION: "1"
        run: |
          pytest --cov=src --cov-report=xml -q -rs

      - name: Validate OpenAPI spec exists
        run: |
          test -f docs/api/openapi.json && echo "OpenAPI JSON present"
          test -f docs/api/openapi.yaml && echo "OpenAPI YAML present"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
