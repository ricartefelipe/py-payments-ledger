name: Post Merge Smoke

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  smoke-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke HTTP (staging)
        run: |
          chmod +x scripts/smoke-post-merge.sh
          ./scripts/smoke-post-merge.sh
        env:
          PAYMENTS_SMOKE_URL: ${{ secrets.PAYMENTS_SMOKE_URL }}
          SMOKE_CHECK_READYZ: "1"
          # Enquanto o staging nao existir, a conferencia avisa em vez de
          # derrubar a pipeline. Para torna-la obrigatoria de novo, crie a
          # variavel SMOKE_REQUIRE_LIVE=1 em Settings -> Secrets and variables
          # -> Actions -> Variables. Ver docs/operations.md, secao 8.
          SMOKE_REQUIRE_LIVE: ${{ vars.SMOKE_REQUIRE_LIVE || '0' }}
