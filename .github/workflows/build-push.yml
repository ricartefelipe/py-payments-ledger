name: Build & Push Docker Images

on:
  push:
    branches: [master, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # A publicacao nao pode avancar enquanto a CI deste mesmo SHA esta pendente ou
  # falhando. Antes, `build-push` e `ci` disparavam em paralelo no mesmo push: a
  # imagem era publicada mesmo quando o lint e os testes falhavam, e um "build
  # verde" dava a impressao de que o commit estava aprovado.
  #
  # A verificacao e feita contra o workflow `ci` **neste** SHA e na sua ultima
  # tentativa — nunca contra o "ultimo verde" de outro commit ou outro evento.
  require-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for the ci workflow on this SHA
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const deadline = Date.now() + 25 * 60 * 1000;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            while (true) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
                per_page: 100,
              });

              const runs = data.workflow_runs.filter((r) => r.name === 'ci');
              if (runs.length === 0) {
                core.setFailed(
                  `Nenhuma execucao do workflow "ci" encontrada para o SHA ${sha}. ` +
                  'A publicacao exige a CI deste commit.'
                );
                return;
              }

              // Ultima tentativa: uma re-execucao substitui o veredito anterior.
              runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              const run = runs[0];
              core.info(`ci run ${run.id}: status=${run.status} conclusion=${run.conclusion}`);

              if (run.status === 'completed') {
                if (run.conclusion === 'success') {
                  core.info('CI deste SHA esta verde; publicacao liberada.');
                  return;
                }
                core.setFailed(
                  `CI deste SHA terminou como "${run.conclusion}". Publicacao bloqueada.`
                );
                return;
              }

              if (Date.now() > deadline) {
                core.setFailed('Tempo esgotado aguardando a CI deste SHA.');
                return;
              }
              await sleep(20000);
            }


  # As duas plataformas publicadas sao executadas de verdade antes de qualquer push: a imagem e
  # construida no runner da propria arquitetura (amd64 e arm64 nativos), escaneada com gate
  # bloqueante e posta para rodar com PostgreSQL, Redis e RabbitMQ reais — healthcheck, dependencias
  # nativas, TLS e a jornada do smoke (API e worker liquidando). Lista de manifestos e wheels
  # disponiveis nao substituem isto.
  smoke-image:
    needs: require-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: smoke
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d smoke" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:3-management
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the runner architecture
        run: |
          echo "uname -m: $(uname -m)"
          case "${{ matrix.arch }}" in
            amd64) test "$(uname -m)" = x86_64 ;;
            arm64) test "$(uname -m)" = aarch64 ;;
          esac

      - name: Build the final images natively
        run: |
          docker build -f docker/api.Dockerfile -t ppl-api:smoke .
          docker build -f docker/worker.Dockerfile -t ppl-worker:smoke .

      - name: Scan the API image (blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ppl-api:smoke
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          exit-code: '1'

      - name: Scan the worker image (blocking)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ppl-worker:smoke
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          exit-code: '1'

      - name: Native dependencies, TLS and certificates inside the image
        run: |
          docker run --rm --entrypoint python ppl-api:smoke -c '
          import psycopg, cryptography, bcrypt, PIL, uvloop, httptools, grpc, pydantic_core, ssl, jwt, httpx, platform
          from psycopg import pq
          print("machine", platform.machine(), "| psycopg", psycopg.__version__, "libpq", pq.version(), pq.__impl__)
          print("openssl", ssl.OPENSSL_VERSION)
          assert bcrypt.checkpw(b"x", bcrypt.hashpw(b"x", bcrypt.gensalt()))
          print("https", httpx.get("https://pypi.org/simple/", timeout=30).status_code)
          '

      - name: Run API and worker against the real services
        env:
          COMMON: >-
            --network host
            -e APP_ENV=staging
            -e DATABASE_URL=postgresql+psycopg://app:app@127.0.0.1:5432/smoke
            -e REDIS_URL=redis://127.0.0.1:6379/0
            -e RABBITMQ_URL=amqp://guest:guest@127.0.0.1:5672/
            -e JWT_SECRET=${{ github.run_id }}-${{ github.run_attempt }}-smoke-only
            -e JWT_ISSUER=local-auth
        run: |
          docker run -d --name api $COMMON -e PORT=8000 ppl-api:smoke
          docker run -d --name worker $COMMON ppl-worker:smoke
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' api)" = healthy ] && break
            if [ "$(docker inspect -f '{{.State.Running}}' api)" != true ]; then docker logs api; exit 1; fi
            sleep 5
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' api)" = healthy || { docker logs api; exit 1; }
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' worker)" = healthy ] && break
            sleep 5
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' worker)" = healthy || { docker logs worker; exit 1; }
          docker exec api sh -c 'python -c "import platform; print(\"api runs on\", platform.machine())"'

      - name: Smoke the API journey (worker settles the payment)
        run: bash scripts/smoke.sh

      - name: Container logs on failure
        if: failure()
        run: |
          docker logs api || true
          docker logs worker || true

  build-and-push:
    needs: [require-ci, smoke-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: api
            dockerfile: docker/api.Dockerfile
            suffix: ""
          - target: worker
            dockerfile: docker/worker.Dockerfile
            suffix: "-worker"
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (${{ matrix.target }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan da imagem **final** publicada, por digest. BLOQUEANTE.
      #
      # A base passou de `python:3.12-slim` (Debian 13) para `python:3.12-alpine`
      # justamente para que este gate pudesse bloquear: os 44 achados HIGH que
      # antes vinham do Debian eram de util-linux, ncurses, systemd e perl-base
      # — pacotes que a aplicação não usa e que não tinham correção publicada.
      # Medido em 2026-10-29, a imagem final em Alpine 3.24 tem 0 HIGH e
      # 0 CRITICAL, de modo que o gate não precisa de concessão nenhuma.
      #
      # Sem `continue-on-error`, sem `ignore-unfixed` e sem lista de exclusão:
      # um achado HIGH ou CRITICAL novo reprova o job e trava a publicação.
      - name: Scan published image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.suffix }}@${{ steps.build.outputs.digest }}
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          exit-code: '1'
          format: 'table'
          output: 'trivy-image-${{ matrix.target }}.txt'

      - name: Upload image scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-${{ matrix.target }}
          path: trivy-image-${{ matrix.target }}.txt
          if-no-files-found: warn

      - name: Summarize image scan
        if: always()
        run: |
          {
            echo "## Scan da imagem ${{ matrix.target }}"
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "Gate bloqueante (HIGH/CRITICAL reprovam) — ver seção 7 de docs/operations.md."
            echo
            echo '```'
            tail -40 "trivy-image-${{ matrix.target }}.txt" 2>/dev/null || echo "(sem relatório)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
