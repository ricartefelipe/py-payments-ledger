name: Check master/develop divergence

# A versao anterior deste workflow promovia `develop` para `master`
# automaticamente:
#
#     git checkout master
#     git reset --hard origin/develop
#     git push origin master --force-with-lease
#
# Isso e incompativel com revisao manual e com a preservacao do historico: um
# commit feito direto em `master` era **apagado** no proximo push em `develop`,
# sem aviso. Nao havia PR, nao havia revisao, e o `--force-with-lease` so
# protegia contra uma corrida entre execucoes do proprio workflow.
#
# Agora o workflow e somente leitura: ele reporta a divergencia e indica o link
# para abrir o PR manualmente. Nao cria, nao mergeia e nao promove nada.
#
# ATENCAO (acao do proprietario): editar este arquivo em uma branch **nao**
# impede que a versao antiga continue disparando a partir de outras refs que
# ainda a contenham. Antes do proximo push em `develop`, desative o workflow
# antigo em Actions -> "Sync master with develop" -> Disable workflow, ou
# garanta que todas as refs que o contem foram atualizadas.

on:
  push:
    branches: [develop, master]
  workflow_dispatch:

concurrency:
  group: check-master-develop-divergence
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Report divergence between master and develop
        shell: bash
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin master develop --quiet

          ahead=$(git rev-list --count origin/master..origin/develop)
          behind=$(git rev-list --count origin/develop..origin/master)

          {
            echo "## Divergencia master / develop"
            echo
            echo "| Direcao | Commits |"
            echo "|---|---:|"
            echo "| develop a frente de master | ${ahead} |"
            echo "| master a frente de develop | ${behind} |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${ahead}" -gt 0 ]]; then
            {
              echo "### develop tem ${ahead} commit(s) ausente(s) em master"
              echo
              echo "Abra o PR manualmente:"
              echo
              echo "${REPO_URL}/compare/master...develop?expand=1"
              echo
              git log --oneline origin/master..origin/develop | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "${behind}" -gt 0 ]]; then
            {
              echo "### master tem ${behind} commit(s) ausente(s) em develop"
              echo
              echo "Commits exclusivos de master nao devem ser perdidos."
              echo "Leve-os para develop antes de alinhar as branches:"
              echo
              git log --oneline origin/develop..origin/master | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::master tem ${behind} commit(s) que develop nao tem."
          fi

          if [[ "${ahead}" -eq 0 && "${behind}" -eq 0 ]]; then
            echo "master e develop estao alinhados." >> "$GITHUB_STEP_SUMMARY"
          fi
