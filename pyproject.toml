[project]
name = "py-payments-ledger"
version = "1.0.0"
description = "Payments engine with double-entry ledger, outbox pattern, idempotency, RBAC/ABAC and observability."
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "Felipe Ricarte", email = "dev@fluxe.io"},
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pydantic[email]>=2.6",
  "PyJWT[crypto]>=2.8",
  "passlib[bcrypt]>=1.7",
  "bcrypt>=4.0,<4.1",
  "redis>=5.0",
  "pika>=1.3",
  "prometheus-client>=0.20",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "stripe>=8.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "python-dateutil>=2.8",
  "cryptography>=43.0",
  "opentelemetry-api>=1.22",
  "opentelemetry-sdk>=1.22",
  "opentelemetry-exporter-otlp>=1.22",
  "opentelemetry-instrumentation-fastapi>=0.43b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.43b0",
  "opentelemetry-instrumentation-httpx>=0.43b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.3",
  "black>=24.0",
  "mypy>=1.8",
  "testcontainers>=4.0",
  "pact-python>=2.2",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".idea", ".git", "__pycache__", ".venv"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=26"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning:passlib.utils",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
